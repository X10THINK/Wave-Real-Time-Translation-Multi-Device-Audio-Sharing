name: wave_flutter
version: 6.3.1+12
description: Wave Android source with integrated Sihan MIC translation gateway adapter and local caption distribution.
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.3
  mobile_scanner: ^7.4.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  record: ^7.1.2
  permission_handler: 12.0.3
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  audio_stream_player: ^1.1.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  shared_preferences_platform_interface: any
flutter:
  uses-material-design: true
  assets:
    - assets/images/
